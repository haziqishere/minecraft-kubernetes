name: Build Docker Images

on:
  push:
    branches:
      - main
      - nonprod
    paths:
      - 'docker/**'
      - 'data_pipelines/**'
      - '.github/workflows/build-docker-images.yaml'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build specific images (comma-separated, or "all")'
        required: false
        default: ''

env:
  REGISTRY: docker.io

jobs:
  # Determine which images need to be built
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Detect changes and build matrix
        id: set-matrix
        run: |
          # Get changed files
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.force_build }}" ]; then
            FORCE_BUILD="${{ github.event.inputs.force_build }}"
          else
            FORCE_BUILD=""
          fi

          # Read build config
          CONFIG_FILE="docker/build-config.yaml"

          # Get all image names
          IMAGES=$(yq e '.images | keys | .[]' $CONFIG_FILE)

          # Determine which images need building
          declare -A NEEDS_BUILD
          declare -A DEPENDS_ON

          for image in $IMAGES; do
            NEEDS_BUILD[$image]="false"
            DEPENDS_ON[$image]=$(yq e ".images.$image.depends_on | .[]" $CONFIG_FILE 2>/dev/null | tr '\n' ',' | sed 's/,$//')

            # Check if force build
            if [ "$FORCE_BUILD" == "all" ] || [[ ",$FORCE_BUILD," == *",$image,"* ]]; then
              NEEDS_BUILD[$image]="true"
              continue
            fi

            # Get paths for this image
            PATHS=$(yq e ".images.$image.paths | .[]" $CONFIG_FILE)

            # Check if any path changed
            for path_pattern in $PATHS; do
              # Get changed files matching this pattern
              CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- "$path_pattern" 2>/dev/null || echo "")
              if [ -n "$CHANGED" ]; then
                NEEDS_BUILD[$image]="true"
                break
              fi
            done
          done

          # Propagate builds to dependents (if a dependency is built, build dependents too)
          CHANGED=true
          while [ "$CHANGED" == "true" ]; do
            CHANGED=false
            for image in $IMAGES; do
              if [ "${NEEDS_BUILD[$image]}" == "false" ]; then
                # Check if any dependency needs build
                for dep in $(echo "${DEPENDS_ON[$image]}" | tr ',' ' '); do
                  if [ -n "$dep" ] && [ "${NEEDS_BUILD[$dep]}" == "true" ]; then
                    NEEDS_BUILD[$image]="true"
                    CHANGED=true
                    break
                  fi
                done
              fi
            done
          done

          # Build matrix JSON
          MATRIX_ITEMS=""
          for image in $IMAGES; do
            if [ "${NEEDS_BUILD[$image]}" == "true" ]; then
              DOCKERFILE=$(yq e ".images.$image.dockerfile" $CONFIG_FILE)
              CONTEXT=$(yq e ".images.$image.context" $CONFIG_FILE)
              DEPS="${DEPENDS_ON[$image]}"

              if [ -n "$MATRIX_ITEMS" ]; then
                MATRIX_ITEMS="$MATRIX_ITEMS,"
              fi
              MATRIX_ITEMS="$MATRIX_ITEMS{\"image\":\"$image\",\"dockerfile\":\"$DOCKERFILE\",\"context\":\"$CONTEXT\",\"depends_on\":\"$DEPS\"}"
            fi
          done

          if [ -n "$MATRIX_ITEMS" ]; then
            echo "matrix={\"include\":[$MATRIX_ITEMS]}" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

          echo "Build matrix: $MATRIX_ITEMS"

  # Build images without dependencies first (layer 0)
  build-layer-0:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Check if this image has no dependencies
        id: check-deps
        run: |
          if [ -z "${{ matrix.depends_on }}" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: steps.check-deps.outputs.should_build == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.check-deps.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check-deps.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        if: steps.check-deps.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:buildcache,mode=max
          provenance: false

      - name: Summary
        if: steps.check-deps.outputs.should_build == 'true'
        run: |
          echo "## Built ${{ matrix.image }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # Build images with dependencies (layer 1+)
  build-layer-1:
    needs: [detect-changes, build-layer-0]
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Check if this image has dependencies
        id: check-deps
        run: |
          if [ -n "${{ matrix.depends_on }}" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: steps.check-deps.outputs.should_build == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.check-deps.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check-deps.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        if: steps.check-deps.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:buildcache,mode=max
          provenance: false

      - name: Summary
        if: steps.check-deps.outputs.should_build == 'true'
        run: |
          echo "## Built ${{ matrix.image }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Dependencies:** ${{ matrix.depends_on }}" >> $GITHUB_STEP_SUMMARY
