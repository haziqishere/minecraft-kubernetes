apiVersion: v1
kind: ConfigMap
metadata:
  name: s3-sink-connector-config
  namespace: streaming
data:
  s3-sink-connector.json: |
    {
      "connector.class": "io.confluent.connect.s3.S3SinkConnector",
      "tasks.max": "1",
      "topics": "transit-positions",

      "s3.region": "ap-southeast-1",
      "s3.bucket.name": "public-transport-dataset",
      "topics.dir": "raw",

      "format.class": "io.confluent.connect.s3.format.json.JsonFormat",
      "storage.class": "io.confluent.connect.s3.storage.S3Storage",

      "partitioner.class": "io.confluent.connect.storage.partitioner.TimeBasedPartitioner",
      "path.format": "'year'=YYYY/'month'=MM/'day'=dd/'hour'=HH",
      "partition.duration.ms": "3600000",
      "timestamp.extractor": "RecordField",
      "timestamp.field": "feed_timestamp",
      "locale": "en-US",
      "timezone": "Asia/Kuala_Lumpur",

      "flush.size": "1000",
      "rotate.interval.ms": "60000",
      "rotate.schedule.interval.ms": "300000",

      "schema.compatibility": "NONE",
      "behavior.on.null.values": "ignore",

      "key.converter": "org.apache.kafka.connect.storage.StringConverter",
      "value.converter": "org.apache.kafka.connect.json.JsonConverter",
      "value.converter.schemas.enable": "false"
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: deploy-s3-sink-connector
  namespace: streaming
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: deploy-connector
          image: curlimages/curl:8.5.0
          command:
            - sh
            - -c
            - |
              echo "Waiting for Kafka Connect to be ready..."
              until curl -s http://kafka-connect:8083/connectors; do
                echo "Kafka Connect not ready, retrying in 5s..."
                sleep 5
              done

              echo "Deploying S3 sink connector..."
              curl -X PUT \
                -H "Content-Type: application/json" \
                --data @/config/s3-sink-connector.json \
                http://kafka-connect:8083/connectors/transit-s3-sink/config

              echo ""
              echo "Connector status:"
              sleep 2
              curl -s http://kafka-connect:8083/connectors/transit-s3-sink/status
          volumeMounts:
            - name: connector-config
              mountPath: /config
      volumes:
        - name: connector-config
          configMap:
            name: s3-sink-connector-config
